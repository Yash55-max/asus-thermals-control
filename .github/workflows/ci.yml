name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Syntax & Lint check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics

      - name: Run test suite with mock sysfs fixtures
        run: |
          pytest -v tests/

      - name: Test CLI execution
        run: |
          python3 app.py --version
          python3 app.py --help

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian and Tarball packages
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          bash package.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thermals-release-packages
          path: dist/
